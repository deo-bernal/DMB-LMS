name: Keep LMS API warm

on:
  schedule:
    - cron: "*/12 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake Render LMS API
        run: |
          curl -fsS -o /dev/null -w "health=%{time_total}s code=%{http_code}\n" \
            "https://dmb-lms-api.onrender.com/health" \
            --max-time 60
